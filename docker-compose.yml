# Local development stack. The ingester service joins this once
# `app/rag/ingest/` exists — see docs/work.md.
services:
  qdrant:
    # Keep in step with `qdrant-client` in pyproject.toml: the client warns and
    # may misbehave when the server's major/minor drift apart.
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      # Exposed for inspection during development; the api reaches it over the
      # compose network regardless.
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      # Service name on the compose network, not localhost.
      QDRANT_URL: http://qdrant:6333
      LOG_DIR: /app/logs
      # Model weights land here, on a named volume, so they are downloaded once
      # rather than on every container recreate.
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      # Development mount: source is live-editable and logs land on the host.
      # An upper environment would drop this and run the code baked into the
      # image — see docs/considerations.md.
      - ./app:/app/app
      - ./logs:/app/logs
      # Survives recreates, so weights are not re-downloaded on every change.
      # The api needs it once BGE-M3 lands for query embedding; the ingester
      # will share the same volume.
      - model-cache:/models
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-storage:
  model-cache:
