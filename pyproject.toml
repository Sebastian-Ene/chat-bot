[project]
name = "chat-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "anthropic>=0.116.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser-driven Playwright tests. Run separately (`uv run pytest -m e2e`) — mixing them with anyio-marked tests in the same process breaks anyio's asyncio runner.",
]
