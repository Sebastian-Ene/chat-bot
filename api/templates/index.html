<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="chat-token" content="{{ chat_token }}" />
    <title>chat-bot</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <script src="{{ url_for('static', path='chat.js') }}" defer></script>
  </head>
  <body>
    <main class="chat">
      <h1 class="chat-title">chat-bot</h1>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>

      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          class="chat-input"
          name="message"
          rows="1"
          aria-label="Chat message"
          placeholder="Ask a question…"
          autocomplete="off"
          required
        ></textarea>
        <button type="submit" class="chat-send">Send</button>
      </form>
    </main>
  </body>
</html>
